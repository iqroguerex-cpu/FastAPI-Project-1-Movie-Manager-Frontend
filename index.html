<!DOCTYPE html>

<html>
<head>
<title>Movie Manager</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f5f5;
}

.header{
font-weight:600;
margin-bottom:25px;
}

.movie-card{
background:white;
border-radius:10px;
padding:15px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
margin-bottom:20px;
}

.movie-title{
font-size:18px;
font-weight:600;
}

.controls{
margin-bottom:25px;
}

</style>

</head>

<body>

<div class="container mt-4">

<h2 class="header text-center">🎬 Movie Manager</h2>

<div class="row controls">

<div class="col-md-2">
<input id="title" class="form-control" placeholder="Title">
</div>

<div class="col-md-2">
<input id="director" class="form-control" placeholder="Director">
</div>

<div class="col-md-2">
<input id="genre" class="form-control" placeholder="Genre">
</div>

<div class="col-md-2">
<input id="rating" class="form-control" placeholder="Rating">
</div>

<div class="col-md-2">
<button class="btn btn-success w-100" onclick="submitMovie()">Save Movie</button>
</div>

</div>

<div class="row mb-4">

<div class="col-md-3">
<input id="genreFilter" class="form-control" placeholder="Filter by Genre">
</div>

<div class="col-md-2">
<button class="btn btn-primary w-100" onclick="filterGenre()">Filter</button>
</div>

<div class="col-md-2">
<button class="btn btn-secondary w-100" onclick="loadMovies()">Show All</button>
</div>

</div>

<div id="movies" class="row"></div>

</div>

<script>

const API_BASE = "https://fastapi-project-1-movie-manager.onrender.com"

let editMode=false

async function loadMovies(){

let response=await fetch(`${API_BASE}/movies`)
let data=await response.json()

renderMovies(data)

}

function renderMovies(data){

let output=""

data.forEach(movie=>{

if(!movie.title) return

output+=`

<div class="col-md-3">

<div class="movie-card">

<div class="movie-title">${movie.title}</div>

<p class="mb-2">
Director: ${movie.director}<br>
Genre: ${movie.genre}<br>
Rating: ⭐ ${movie.rating}
</p>

<div class="d-flex gap-2">

<button class="btn btn-sm btn-warning" onclick="editMovie('${movie.title}','${movie.director}','${movie.genre}','${movie.rating}')">Edit</button>

<button class="btn btn-sm btn-danger" onclick="deleteMovie('${movie.title}')">Delete</button>

</div>

</div>

</div>

`

})

document.getElementById("movies").innerHTML=output

}

async function submitMovie(){

let title=document.getElementById("title").value.trim()
let director=document.getElementById("director").value.trim()
let genre=document.getElementById("genre").value.trim()
let rating=document.getElementById("rating").value.trim()

if(title=="" || director=="" || genre=="" || rating==""){
alert("Please fill all fields")
return
}

let movie={
title:title,
director:director,
genre:genre,
rating:parseInt(rating)
}

if(editMode){

await fetch(`${API_BASE}/movies/update_movie`,{

method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(movie)

})

editMode=false

}else{

await fetch(`${API_BASE}/movies/create_movie`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(movie)

})

}

clearInputs()

loadMovies()

}

function editMovie(title,director,genre,rating){

document.getElementById("title").value=title
document.getElementById("director").value=director
document.getElementById("genre").value=genre
document.getElementById("rating").value=rating

editMode=true

}

async function deleteMovie(title){

if(!confirm("Delete this movie?")) return

let encodedTitle=encodeURIComponent(title)

await fetch(`${API_BASE}/movies/delete_movie/${encodedTitle}`,{
method:"DELETE"
})

loadMovies()

}

async function filterGenre(){

let genre=document.getElementById("genreFilter").value.trim()

if(genre==""){
loadMovies()
return
}

let response=await fetch(`${API_BASE}/movies/?genre=${genre}`)

let data=await response.json()

renderMovies(data)

}

function clearInputs(){

document.getElementById("title").value=""
document.getElementById("director").value=""
document.getElementById("genre").value=""
document.getElementById("rating").value=""

}

loadMovies()

</script>

</body>

</html>
