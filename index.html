<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQROGUEREX | Movie Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-bold text-blue-500 mb-2">REX Movie Manager</h1>
            <p class="text-gray-400">AWS Serverless Backend (FastAPI + DynamoDB)</p>
        </header>

        <div class="bg-gray-800 p-6 rounded-lg shadow-xl mb-10 border border-gray-700">
            <h2 class="text-xl font-semibold mb-4 text-blue-400">Add New Movie</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input id="title" type="text" placeholder="Movie Title" class="bg-gray-700 p-2 rounded border border-gray-600 focus:outline-none focus:border-blue-500">
                <input id="genre" type="text" placeholder="Genre" class="bg-gray-700 p-2 rounded border border-gray-600 focus:outline-none focus:border-blue-500">
                <button onclick="addMovie()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition">Add Movie</button>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg shadow-xl border border-gray-700">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-blue-400">Movie Collection</h2>
                <button onclick="fetchMovies()" class="text-sm bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded">Refresh</button>
            </div>
            <div id="movie-list" class="space-y-3">
                <p class="text-gray-500 text-center py-4">Loading movies...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "https://act0h7myif.execute-api.ap-south-1.amazonaws.com/default";

        async function fetchMovies() {
            try {
                const response = await fetch(`${API_BASE}/movies`);
                const movies = await response.json();
                const list = document.getElementById('movie-list');
                
                if (movies.length === 0) {
                    list.innerHTML = '<p class="text-gray-500 text-center py-4">No movies found in DynamoDB.</p>';
                    return;
                }

                list.innerHTML = movies.map(movie => `
                    <div class="flex justify-between items-center bg-gray-700 p-4 rounded border-l-4 border-blue-500">
                        <div>
                            <span class="font-bold text-lg">${movie.title}</span>
                            <span class="ml-2 text-sm text-gray-400 italic">(${movie.genre || 'No Genre'})</span>
                        </div>
                        <button onclick="deleteMovie('${movie.title}')" class="text-red-400 hover:text-red-600 font-bold">Delete</button>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Fetch error:", err);
            }
        }

        async function addMovie() {
            const title = document.getElementById('title').value;
            const genre = document.getElementById('genre').value;

            if (!title) return alert("Title is required");

            await fetch(`${API_BASE}/movies`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, genre })
            });

            document.getElementById('title').value = '';
            document.getElementById('genre').value = '';
            fetchMovies();
        }

        async function deleteMovie(title) {
            if (!confirm(`Delete ${title}?`)) return;
            await fetch(`${API_BASE}/movies/${encodeURIComponent(title)}`, { method: 'DELETE' });
            fetchMovies();
        }

        // Initial Load
        fetchMovies();
    </script>
</body>
</html>
